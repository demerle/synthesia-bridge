[project]
name = "synthesia-bridge"
description = "Convert sheet music images/PDFs into MIDI piano performances for Synthesia"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "homr",
    "music21",
]

[project.optional-dependencies]
gpu = [
    "homr[gpu]",
]
dev = [
    "pytest",
]

[project.scripts]
synthesia-bridge = "synthesia_bridge.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
