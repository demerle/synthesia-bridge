[project]
name = "synthesia-bridge"
version = "0.1.0"
description = "Run HOMR to convert PNG sheet music images into MusicXML"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "homr",
    "PyMuPDF",
    "music21",
]

[project.scripts]
musicxml-to-midi = "synthesia_bridge.services.musicXML_to_midi:main"

[project.optional-dependencies]
gpu = [
    "homr[gpu]",
]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
